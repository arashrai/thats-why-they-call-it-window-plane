<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aircraft HUD</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="hud">
      <div class="plane-count" id="plane-count" aria-live="polite"></div>

      <div class="hud-orbit" id="hud-orbit">
        <div class="look-arrow" id="look-arrow" aria-hidden="true">
          <svg viewBox="0 0 120 60" role="img" aria-label="">
            <path d="M8 30 H92" class="arrow-line" />
            <path d="M72 10 L102 30 L72 50" class="arrow-head" />
          </svg>
        </div>

        <section class="plane-info" id="plane-info" aria-live="polite">
          <div class="flight" id="flight">—</div>
          <div class="aircraft-type" id="aircraft-type"></div>
          <div class="metrics primary-metrics" id="metrics-primary"></div>
          <div class="metrics" id="metrics-secondary"></div>
          <div class="updated" id="updated"></div>
        </section>
      </div>

      <div class="debug-corner" id="debug-corner" aria-live="polite"></div>
      <div id="status" class="status-banner" hidden></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
